name: FOXSYCU legacy runtime migration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, 'legacy runtime migration') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch AppLedger onto the runtime banking layer
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/AppLedger.tsx')
          text = path.read_text()

          text = text.replace(
              "import { createContext, useContext, useMemo, useState } from 'react'",
              "import { createContext, useContext, useEffect, useMemo, useState } from 'react'"
          )
          text = text.replace(
              "import { customer } from './data/mockData'",
              "import { customer } from './data/mockData'\nimport { refreshCustomerSnapshot, runtimeEngine, useRuntimeRefresh } from './data/runtimeBanking'\nimport { createRuntimeVault, hydrateRuntimeVaults } from './data/runtimeVaults'"
          )

          text = text.replace(
              "const openingBalance=125000",
              "const openingBalance=runtimeEngine.getLedger().openingBalance"
          )
          text = text.replace(
              "type LedgerContext={transactions:Transaction[];add:(tx:Transaction)=>void}",
              "type LedgerContext={transactions:Transaction[];add:(tx:Transaction)=>Transaction}"
          )

          old_provider = "function LedgerProvider({children}:{children:React.ReactNode}){const[extra,setExtra]=useState<Transaction[]>([]);const transactions=useMemo(()=>[...extra,...customer.transactions].sort((a,b)=>new Date(`${b.date} ${b.time}`).getTime()-new Date(`${a.date} ${a.time}`).getTime()),[extra]);return <Ledger.Provider value={{transactions,add:tx=>setExtra(v=>[tx,...v])}}>{children}</Ledger.Provider>}"
          new_provider = """function LedgerProvider({children}:{children:React.ReactNode}){\n  useRuntimeRefresh()\n  useEffect(()=>{hydrateRuntimeVaults();refreshCustomerSnapshot()},[])\n  const transactions=useMemo(()=>[...customer.transactions].sort((a,b)=>new Date(`${b.date} ${b.time}`).getTime()-new Date(`${a.date} ${a.time}`).getTime()),[customer.transactions])\n  const add=(tx:Transaction)=>{\n    const amount=Math.abs(tx.amount)\n    let result\n    if(tx.kind==='Transfer') result=runtimeEngine.send({amount,beneficiary:tx.counterparty||'',memo:tx.memo})\n    else if(tx.kind==='Withdrawal') result=runtimeEngine.withdraw({amount,memo:tx.memo})\n    else result=runtimeEngine.adminCredit({amount,reason:tx.memo||tx.description,adminId:'customer-funding-review'})\n    refreshCustomerSnapshot()\n    return result.transaction\n  }\n  return <Ledger.Provider value={{transactions,add}}>{children}</Ledger.Provider>\n}"""
          if old_provider not in text:
              raise SystemExit('Expected legacy LedgerProvider was not found; aborting.')
          text = text.replace(old_provider, new_provider)

          old_totals = "function totals(ts:Transaction[]){const posted=ts.filter(t=>t.status==='Completed');const pending=ts.filter(t=>t.status==='Pending');return{posted,pending,pendingAmount:pending.reduce((s,t)=>s+Math.abs(t.amount),0),balance:openingBalance+posted.reduce((s,t)=>s+t.amount,0)}}"
          new_totals = "function totals(ts:Transaction[]){const posted=ts.filter(t=>t.status==='Completed');const pending=ts.filter(t=>t.status==='Pending');return{posted,pending,pendingAmount:pending.reduce((s,t)=>s+Math.abs(t.amount),0),balance:runtimeEngine.getAvailableBalance()}}"
          if old_totals not in text:
              raise SystemExit('Expected legacy totals function was not found; aborting.')
          text = text.replace(old_totals, new_totals)

          text = text.replace(
              "let running=openingBalance;",
              "let running=runtimeEngine.getLedger().openingBalance;"
          )

          old_confirm = "add(tx);setCreated(tx)"
          new_confirm = "const runtimeTransaction=add(tx);setCreated(runtimeTransaction)"
          if old_confirm not in text:
              raise SystemExit('Expected transfer confirmation hook was not found; aborting.')
          text = text.replace(old_confirm, new_confirm, 1)

          path.write_text(text)

          vault_path = Path('src/data/runtimeVaults.ts')
          vault = vault_path.read_text()
          vault = vault.replace(
              "    interestEarned: 0,\n  }",
              "    interestEarned: 0,\n    opened: new Date().toLocaleDateString('en-US', { month: 'long', year: 'numeric' }),\n  }"
          )
          vault_path.write_text(vault)

      - name: Install dependencies
        run: npm ci

      - name: TypeScript/build verification
        run: npm run build

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/AppLedger.tsx src/data/runtimeVaults.ts
          git diff --cached --quiet && exit 0
          git commit -m "feat: migrate legacy FOXSYCU UI to runtime banking layer"
          git push
